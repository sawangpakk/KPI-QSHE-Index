<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSHE Index Dashboard — สายงาน NGV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgenjs.bundle.js"></script>
<style>
:root{
  /* Better Together palette, applied to the QSHE dashboard's existing
     CSS variables so the whole page picks it up without rewriting every
     rule. Level colors (L1-L5, red/orange/yellow/green) stay untouched
     since they carry real meaning (worse..better), not just decoration. */
  --navy:#1B2A6B;       /* was #0B2F5C  -> BT --petrol   */
  --blue:#2E9BF0;       /* was #1E73BE  -> BT --petrol-2 */
  --blue-dark:#16213A;  /* was #1B2A6B  -> BT --ink      */
  --teal:#2E9BF0;       /* was #0FD6C4  -> BT --teal     */
  --teal2:#0EC6E6;      /* was #159AD6  -> BT --red (cyan accent) */
  --ink:#16213A;        /* was #1B2A38  -> BT --ink      */
  --ink-soft:#51607A;   /* was #5B6B79  -> BT --ink-soft */
  --l1-soft:#F9CBC9; --l1-solid:#EE9C9B;
  --l2-soft:#FBE1BE; --l2-solid:#F5BF87;
  --l3-soft:#FBF4B4; --l3-solid:#F2E066;
  --l4-soft:#D8F0DD; --l4-solid:#A6E1B7;
  --l5-soft:#BFF0D6; --l5-solid:#65D998;
  --gray-dash:#E4E8EB;
  /* Better Together extras used directly by the reskinned shell */
  --bt-paper:#F4F8FC;
  --bt-line:#E1E8F0;
  --bt-amber:#FF7EC4;
  --bt-amber-deep:#C23E8F;
  --bt-radius:12px;
  --font-display:'Kanit',sans-serif;
  --font-body:'IBM Plex Sans Thai',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bt-paper);font-family:var(--font-body);color:var(--ink);}
h1,h2,h3,.disp{font-family:var(--font-display);}

/* ---------------- Deck shell (continuous scrolling page) ---------------- */
#deck{
  width:100%;
  padding:100px 16px 60px;
  box-sizing:border-box;
}
#stage{
  width:100%; max-width:1280px; margin:0 auto;
  display:flex; flex-direction:column; gap:28px;
}
.slide{
  width:100%; min-height:720px;
  background:#fff;
  position:relative;
  display:flex !important;
  flex-direction:column;
  overflow:hidden;
  border-radius:var(--bt-radius);
  border:1px solid var(--bt-line);
  box-shadow:0 2px 10px rgba(20,30,45,.06);
  scroll-margin-top:130px; /* so anchor-jumping doesn't tuck a section under the sticky toolbar/nav */
}

/* bottom gradient strip used across slides */
.strip{
  position:absolute; left:0; right:0; bottom:0; height:10px;
  background:linear-gradient(90deg,var(--teal) 0%, var(--teal2) 55%, var(--blue) 100%);
}
.brandmark{
  position:absolute; top:26px; right:34px; display:flex; align-items:center; gap:8px;
  font-family:'Kanit',sans-serif; font-weight:700; font-size:15px; color:var(--navy);
}
.brandmark .flame{width:20px;height:20px;}
.tagline{
  position:absolute; right:34px; bottom:22px; font-size:11.5px; color:#fff; font-weight:600;
  display:flex; align-items:center; gap:8px; z-index:2;
}

/* ---------------- Cover slide ---------------- */
.cover{
  background:
    linear-gradient(rgba(10,20,55,.32), rgba(10,20,55,.32)),
    linear-gradient(135deg, #FF7EC4 0%, #B98FE0 28%, #2E9BF0 62%, #00D8FF 100%);
  color:#fff; justify-content:center; padding:70px 90px;
}
.cover .flame-mark{position:absolute; top:34px; left:40px; display:flex; align-items:center; gap:10px; font-family:'Kanit'; font-weight:700; font-size:17px;}
.cover .eyebrow{font-size:13px; letter-spacing:.03em; color:#D8F7F1; margin:0 0 10px; font-weight:600;}
.cover h1{font-size:44px; line-height:1.25; margin:0; font-weight:700; max-width:820px;}
.cover .foot{position:absolute; right:60px; bottom:50px; text-align:right; font-size:13.5px; color:#EAF7FF; line-height:1.6;}

/* ---------------- Divider slide ---------------- */
.divider{align-items:center; justify-content:center; text-align:center; position:relative; min-height:340px !important;}
.divider .num{color:var(--ink); font-weight:700;}
.divider h2{font-size:34px; margin:0; font-weight:700; color:#111;}
.divider .sub{font-size:22px; margin-top:10px; font-weight:700; color:#111;}

/* ---------------- Hero divider (with illustration) ---------------- */
.hero-divider{position:relative; align-items:center; justify-content:center; padding:0 100px; flex-direction:row; gap:50px; min-height:420px !important;}
.hero-divider .hero-illus{width:230px; height:230px; flex-shrink:0;}
.hero-divider .hero-illus svg{width:100%; height:100%;}
.hero-divider .hero-text h2{font-size:38px; color:var(--navy); font-weight:700; margin:0;}
.hero-divider .hero-text .sub{font-size:26px; color:var(--navy); font-weight:700; margin-top:8px;}

/* ---------------- Content slide header ---------------- */
.content{padding:26px 40px 22px;}
.content h2.title{font-size:26px; color:var(--blue); margin:0 0 16px; font-weight:700; padding-right:170px;}
.content h2.title b{color:var(--blue);}
.content h2.title .date-part{color:#111;}

/* ---------------- KPI grid (overview slide) ---------------- */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
.kpi-box{border:1px solid #E1E6EA; border-radius:8px; padding:14px 16px;}
.kpi-box .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.kpi-box .val{font-family:'Kanit'; font-size:28px; font-weight:700; color:var(--navy);}
.kpi-box .val small{font-size:13px; color:var(--ink-soft); font-weight:500;}

.chart-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
.chart-card{border:1px solid #E1E6EA; border-radius:8px; padding:12px 16px 6px;}
.chart-card .h{font-size:13px; font-weight:700; color:#fff; padding:6px 10px; border-radius:5px; margin-bottom:8px; display:inline-block;}

.legend-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
.legend-chip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); background:#F5F8FA; border:1px solid #E1E6EA; padding:4px 9px; border-radius:14px;}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* ---------------- QSHE Index table slide ---------------- */
.qtable-wrap{padding:0 40px 24px;}
table.qtable{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
table.qtable th, table.qtable td{border:1px solid #E1E6EA; padding:5px 6px; text-align:center; vertical-align:middle;}
table.qtable thead th{background:#DCEBF7; color:var(--navy); font-weight:700; font-size:11.5px;}
table.qtable thead .band-row th{font-size:10.5px; font-weight:700; color:#5a4a2a;}
table.qtable td.kpi-name{text-align:left; font-weight:600; color:var(--ink);}
table.qtable td.kpi-desc{text-align:left; font-size:11px; color:var(--ink-soft);}
tr.cat-row td{background:var(--blue); color:#fff; font-weight:700; text-align:left; font-size:12.5px; padding:6px 10px;}
tr.overall-row td{background:var(--navy); color:#fff; font-weight:700; text-align:left; font-size:13px; padding:6px 10px;}
.pill{display:inline-block; min-width:30px; padding:2px 6px; border-radius:4px; font-weight:700; color:#123; font-size:11.5px;}
.dash{color:#aaa; font-size:11px;}

/* ---------------- Safety slide ---------------- */
/* ---------------- Personal Safety section (Employee/Contractor cards) ---------------- */
.ps-title{font-family:'Kanit',sans-serif; font-size:16px; font-weight:700; text-align:center; color:var(--ink); margin-bottom:8px;}
.ps-section{display:flex; gap:6px; margin-bottom:10px;}
.ps-tag{
  writing-mode:vertical-rl; transform:rotate(180deg); text-align:center;
  font-family:'Kanit',sans-serif; font-weight:700; font-size:12px; color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:5px; flex:none; width:20px; padding:4px 0;
}
.ps-tag svg{width:22px; height:22px; writing-mode:horizontal-tb; transform:rotate(180deg); flex:none;}
.ps-body{flex:1; min-width:0;}
.ps-metrics{display:grid; gap:4px; margin-bottom:2px;}
.ps-metric{text-align:center; min-width:0;}
.ps-metric svg{width:30px; height:30px;}
.ps-metric .ps-metric-cap{font-size:8px; color:var(--ink-soft); line-height:1.15; height:22px; overflow:hidden; margin-top:1px; overflow-wrap:break-word; word-break:break-word;}
table.ps-table{width:100%; border-collapse:collapse; font-size:9.5px;}
table.ps-table th{color:#fff; font-weight:700; padding:4px 2px; text-align:center; font-size:10px;}
table.ps-table td{border:1px solid #fff; padding:4px 3px; text-align:center; background:#fff;}
table.ps-table td.ps-rowlabel{font-weight:700; background:#F4F8FC; color:var(--ink); width:34px;}
table.ps-table tr.ps-result td{font-weight:700;}
table.ps-table.green th{background:#0F9D58;}
table.ps-table.green tr.ps-result td{background:#C7F0D8;}
table.ps-table.red th{background:#E53935;}
table.ps-table.red tr.ps-result td{background:#F8CFCD;}
table.ps-table tr.ps-result td.ps-rowlabel{background:#F4F8FC;}

.obj-box{background:#DFFBFB; border:1px solid #B7EDEE; border-radius:6px; padding:14px 18px; margin-bottom:16px; font-size:13px;}
.obj-box .head{background:#3E7FD9; color:#fff; font-weight:700; padding:6px 12px; border-radius:5px; display:inline-block; margin:-14px -18px 12px; width:calc(100% + 36px);}
.obj-box p{margin:4px 0;}

table.safety-tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
table.safety-tbl th,table.safety-tbl td{border:1px solid #fff; padding:8px; text-align:center;}
table.safety-tbl thead th{background:#5B93D6; color:#fff; font-weight:700;}
table.safety-tbl tbody tr:nth-child(odd) td.rowlabel{background:#EAF0F8;}

/* ---------------- Backup slide ---------------- */
.backup-list{font-size:14px; line-height:1.9;}
.backup-list code{background:#F0F3F6; padding:1px 6px; border-radius:4px; font-size:12.5px;}
.flag-note{background:#FFF6E9; border:1px solid #F3D9A6; color:#8a5a12; padding:12px 16px; border-radius:6px; font-size:13px; margin-top:14px;}

/* ---------------- Thank-you slide ---------------- */
.thanks{
  background:linear-gradient(135deg, #FF6FC0 0%, #9C8FE0 35%, #2E9BF0 68%, #00D8FF 100%);
  color:#fff; align-items:center; justify-content:center; min-height:340px !important;
}
.thanks h1{font-size:56px; font-weight:700; margin:0;}

/* ---------------- Report-card slides (Q Performance / Safety / Security / Env / Legal) ---------------- */
.report{padding:20px 34px 16px;}
.report h2.rtitle{font-size:24px; color:var(--navy); margin:0 0 12px; font-weight:700; padding-right:160px;}
.report .cols{display:grid; gap:12px; max-height:565px; overflow-y:auto;}
.report .cols > div{min-width:0;} /* prevent a column's content (e.g. long captions) from forcing it wider than its 1fr share */
.report .colhead{font-size:13.5px; font-weight:700; text-align:center; color:var(--ink); margin-bottom:6px;}
.rag-box{border:1px solid #333; border-radius:2px; margin-bottom:10px; font-size:10.5px; overflow:hidden;}
.rag-box .rag-head{padding:5px 8px; font-weight:700; color:#fff; font-size:10.5px; text-align:center;}
.rag-box.green .rag-head{background:#0F9D58;}
.rag-box.red .rag-head{background:#E53935;}
.rag-box.yellow .rag-head{background:#F5B301;}
.rag-box.blue .rag-head{background:#3E7FD9;}
.rag-box.gray .rag-head{background:#9AA1A8;}
.rag-box .rag-row{display:flex; border-top:1px solid #333;}
.rag-box .rag-row .rlabel{width:56px; flex-shrink:0; font-weight:700; padding:4px 6px; border-right:1px solid #333; background:#fafafa;}
.rag-box .rag-row .rval{padding:4px 6px; flex:1;}
.mini-icon{width:34px; height:34px; margin:0 auto 4px; display:block;}
.mini-chart-card{border:1px solid #ccc; border-radius:4px; padding:6px 8px 2px; margin-top:6px;}
.mini-chart-card .mctitle{font-size:10px; font-weight:700; text-align:center;}
.mini-chart-card canvas, .mini-chart-card .fallback-chart{margin-top:auto;} /* when the card is a flex column (stretched taller by a sibling), this keeps the title pinned at top and pushes the chart itself down flush with the bottom instead of floating with empty space beneath it */
.report .divline{border-left:2px dashed #d33; height:100%;}
.rag-legend{
  position:absolute; left:34px; bottom:18px; z-index:2;
  display:flex; gap:14px; font-size:10.5px;
  background:rgba(255,255,255,.94); padding:4px 10px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.rag-legend span{display:flex; align-items:center; gap:5px; white-space:nowrap;}
.rag-legend i{width:14px; height:14px; display:inline-block; border-radius:2px; flex-shrink:0;}
.stat-block{border-radius:6px; padding:12px 16px; text-align:center; margin-bottom:10px;}
.stat-block .n{font-family:'Kanit'; font-size:30px; font-weight:700;}
.stat-block .t{font-size:13px; font-weight:700;}
.pyramid-row{color:#fff; font-weight:700; font-size:11px; padding:4px 6px; text-align:center; margin-bottom:2px;}

/* ---------------- Quick-nav (jump to section) ---------------- */
#monthReminder{
  position:fixed; left:0; right:0; z-index:53;
  background:#FFF4D6; border-bottom:1px solid #F0D385; color:#7a5200;
  display:flex; align-items:center; gap:14px; padding:8px 18px; font-size:12.5px; font-weight:600;
}
#monthReminder button{
  font-family:'IBM Plex Sans Thai',sans-serif; font-size:12px; font-weight:700; cursor:pointer; border-radius:7px; padding:5px 12px; border:none;
}
#monthReminder #btnDismissReminder{background:#1B2A6B; color:#fff;}
#monthReminder #btnSnoozeReminder{background:transparent; color:#7a5200; padding:5px 8px; margin-left:auto; font-size:14px;}
#quickNav{
  position:fixed; left:0; right:0; top:50px; z-index:54;
  background:var(--navy); border-bottom:1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; gap:10px; padding:8px 18px;
}
#quickNav label{color:rgba(255,255,255,.65); font-size:12px; white-space:nowrap;}
#quickNav select{
  flex:1; max-width:420px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px;
  padding:7px 10px; font-size:12.5px; font-family:'IBM Plex Sans Thai',sans-serif;
}
#quickNav .scrollpct{color:var(--bt-amber); font-weight:700; font-size:11.5px; margin-left:auto; white-space:nowrap;}
#progressTrack{position:fixed; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.2); z-index:60;}
#progressBar{height:100%; background:linear-gradient(90deg,var(--bt-amber),var(--teal2)); width:0%; transition:width .15s ease;}

/* ---------------- Toolbar (Excel data link) ---------------- */
#toolbar{
  position:fixed; top:4px; left:0; right:0; z-index:55;
  background:
    linear-gradient(rgba(10,20,55,.45), rgba(10,20,55,.45)),
    linear-gradient(120deg, #FF7EC4 0%, #B98FE0 25%, #2E9BF0 60%, #00D8FF 100%);
  color:#fff; font-size:13px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px 18px; box-shadow:0 6px 18px rgba(0,0,0,.18);
}
#toolbar .tb-label{color:rgba(255,255,255,.75); font-size:12px;}
#toolbar .tb-file{font-weight:600; color:#fff;}
#toolbar .tb-btn{
  background:var(--bt-amber);
  color:var(--navy); border:none; padding:7px 14px; border-radius:8px;
  font-weight:700; font-size:12.5px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;
}
#toolbar .tb-btn.secondary{background:rgba(255,255,255,.12); color:#fff; font-weight:600; border:1px solid rgba(255,255,255,.25);}
#toolbar .tb-btn:hover{filter:brightness(1.08);}
#toolbar input[type=file]{display:none;}
#toolbar .tb-status{font-size:11.5px; color:rgba(255,255,255,.75); margin-left:auto;}
#toolbar .tb-status.warn{color:#ffe08a;}
#toolbar .tb-status.ok{color:#a7f3c8;}
#toolbar .tb-btn.admin{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.3);}

/* ---------------- Admin panel ---------------- */
#adminOverlay{
  position:fixed; inset:0; background:rgba(10,16,22,.55); z-index:200;
  display:none; align-items:flex-start; justify-content:stretch; padding:0; overflow-y:auto;
}
#adminOverlay.open{display:flex;}
#adminPanel{
  background:#fff; border-radius:0; width:100%; min-height:100vh; box-shadow:none;
  overflow:hidden; font-family:'IBM Plex Sans Thai',sans-serif;
  display:flex; flex-direction:column;
}
#adminPanel .ap-head{
  background:linear-gradient(90deg,var(--navy),var(--blue)); color:#fff; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:5; flex:none;
}
#adminPanel .ap-head h3{margin:0; font-family:'Kanit'; font-size:18px; font-weight:600;}
#adminPanel .ap-head button{background:rgba(255,255,255,.15); border:none; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px;}
#adminPanel .ap-body{padding:20px 24px; flex:1; overflow-y:visible; width:100%; box-sizing:border-box;}
#adminPanel .ap-section{margin-bottom:26px;}
#adminPanel .ap-section h4{font-family:'Kanit'; font-size:14.5px; color:#1B2A6B; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid #DCEEFB;}
#adminPanel table.ap-table{border-collapse:collapse; width:100%; font-size:12px;}
#adminPanel table.ap-table th, #adminPanel table.ap-table td{border:1px solid #e5e7eb; padding:5px 6px; text-align:center;}
#adminPanel table.ap-table th{background:#EAF4FD; color:#1B2A6B; font-weight:600; position:sticky; top:0;}
#adminPanel table.ap-table td.lbl{text-align:left; font-weight:600; min-width:170px;}
#adminPanel table.ap-table input[type=number]{width:52px; padding:3px; border:1px solid #d1d5db; border-radius:4px; text-align:center; font-size:12px;}
#adminPanel table.ap-table input[type=text]{width:100%; padding:4px 6px; border:1px solid #d1d5db; border-radius:4px; font-size:11.5px; box-sizing:border-box;}
#adminPanel .ap-scrollx{overflow-x:auto; border:1px solid #eee; border-radius:6px;}
#adminPanel tr.cat td{background:#EAF4FD;}
#adminPanel .ap-foot{padding:16px 24px; border-top:1px solid #eee; display:flex; gap:10px; align-items:center; justify-content:flex-end; position:sticky; bottom:0; background:#fff; z-index:5; flex:none;}
#adminPanel .ap-btn{padding:9px 18px; border-radius:7px; border:none; font-weight:700; font-size:13px; cursor:pointer; font-family:'IBM Plex Sans Thai',sans-serif;}
#adminPanel .ap-btn.save{background:linear-gradient(90deg,#16a34a,#22c55e); color:#fff;}
#adminPanel .ap-btn.cancel{background:#e5e7eb; color:#374151;}
#adminPanel .ap-btn.reset{background:#fee2e2; color:#991b1b; margin-right:auto;}
#adminPanel .ap-note{font-size:11.5px; color:#6b7280; margin-top:8px;}
#adminPanel .ap-note code{background:#DCEEFB; color:#1B2A6B; padding:1px 5px; border-radius:4px; font-size:11px;}
#adminPanel input.formula-cell{width:100%; padding:3px; border:1px solid #d1d5db; border-radius:4px; text-align:center; font-size:11.5px; box-sizing:border-box;}
#adminPanel input.formula-cell.is-formula{color:#C23E8F; font-style:italic; font-weight:700; border-color:#9CC9F5;}
#adminPanel .view-cell{padding:4px 5px; font-size:11.5px; color:#1f2937; min-height:1.3em; white-space:pre-wrap; word-break:break-word;}
#adminPanel .view-cell.is-formula{color:#C23E8F; font-style:italic; font-weight:700;}
#adminPanel table.ap-table td{ vertical-align:middle; }
#adminPanel .idx-chip{display:inline-block; min-width:20px; padding:2px 6px; background:#EAF4FD; color:#1B2A6B; border-radius:10px; font-weight:700; font-size:11px;}
#adminPanel td.row-idx-badge{ text-align:center; }
</style>
</head>
<body>

<div id="progressTrack"><div id="progressBar"></div></div>
<div id="toolbar">
  <span class="tb-label">แหล่งข้อมูล QSHE Index:</span>
  <span class="tb-file" id="tbFileName">ข้อมูลตัวอย่าง (Demo)</span>
  <button class="tb-btn admin" id="btnAdminToggle">🔧 โหมดแอดมิน</button>
  <button class="tb-btn admin" id="btnAdminEdit" style="display:none;">✏️ แก้ไขข้อมูล</button>
  <button class="tb-btn secondary" id="btnExportPptx">📊 พิมพ์เป็น PPT</button>
  <button class="tb-btn secondary" id="btnSendEmail">📧 ส่งอีเมลแจ้งเสร็จสิ้น</button>

/* ---------- helpers ---------- */
function levelBand(v){
  if(v===null||v===undefined) return null;
  if(v<1.5) return 1; if(v<2.5) return 2; if(v<3.5) return 3; if(v<4.5) return 4; return 5;
}
const SOLID = {1:'#EE9C9B',2:'#F5BF87',3:'#F2E066',4:'#A6E1B7',5:'#65D998'};
const SOFT  = {1:'#F9CBC9',2:'#FBE1BE',3:'#FBF4B4',4:'#D8F0DD',5:'#BFF0D6'};
function pill(v, digits=2){
  if(v===null||v===undefined) return `<span class="dash">-</span>`;
  const b = levelBand(v);
  return `<span class="pill" style="background:${SOLID[b]}">${v.toFixed(digits)}</span>`;
}
function fmt(v,d=2){ return (v===null||v===undefined)?'—':Number(v).toFixed(d); }
function esc(s){ return (s===null||s===undefined)?'':String(s); }
function fmtInt(v){ return (v===null||v===undefined||v==='') ? '-' : Number(v).toLocaleString('en-US'); }
function levelBgColor(v){
  if(v===null||v===undefined||v==='') return '#ffffff';
  const n = Number(v);
  if(isNaN(n)) return '#ffffff';
  const b = levelBand(n);
  return b ? SOLID[b] : '#ffffff';
}
function scoreElId(idx, sn){ return 'sc_' + idx + '_' + sn.replace(/[^a-zA-Z0-9ก-๙]/g,'_'); }

/* =========================================================
   Excel-style formula engine for the admin table.
   Any %, Level or score cell can hold either a plain number or
   a formula starting with "=" that references other cells
   WITHIN THE SAME SECTION COLUMN, using:
     W3 / L3 / S3   -> weight / level / score of tier2_rows[3]
     SUM(W4:W6)     -> range sum
     SUM(S1,S3,S7)  -> list sum
     plain + - * / ( ) arithmetic between references and numbers
   Editing works like Excel: the cell shows the computed value
   normally, and shows the raw formula text while it's focused.
   This operates on a draft copy of the data (ADMIN_DRAFT) so
   "ยกเลิก" (Cancel) can discard edits cleanly.
   ========================================================= */
let ADMIN_DRAFT = null;   // deep-cloned working copy of tier2_rows while the panel is open
let ADMIN_CHART_DRAFT = null; // deep-cloned working copy of chart_overrides while the panel is open
let ADMIN_LEGAL_DRAFT = null; // deep-cloned working copy of {stats, docs} for the Legal and compliance page while the panel is open
let ADMIN_EXTRA_CHARTS_DRAFT = null; // deep-cloned working copy of report_overrides.extraCharts (per page, admin-added custom charts) while the panel is open
let ADMIN_SECTIONS = [];
let TABLE_VIEW_MODE = true; // true = clean read-only text (default), false = editable formula cells
const BAND_LABELS = ["ต่ำมาก","ต่ำ","ปกติ","ดี","ดีมาก"];
const BAND_COLORS = ["#F4A9A4","#F7CBA0","#FCEB6B","#B8E8C8","#7BDDA3"];
const BAND_BG_LIGHT = ["#FBEAE9","#FCEEE0","#FDF6D0","#E3F3E7","#D8F3E3"]; // opaque pastel versions for sticky cell backgrounds — must stay fully opaque or scrolled content bleeds through

function isFormula(v){ return typeof v === 'string' && v.trim().startsWith('='); }

function cellElId(field, idx, sn){ return 'cell_' + field + '_' + idx + '_' + sn; }

/* The "%" column is stored and computed internally as a plain fraction
   (0.05 = 5%) so formulas like =W4*L4 work without any manual "/100" —
   it's only converted to/from the percent number typed and shown on
   screen at the very edges (display + when the admin types a plain
   number into a % box). Formula text itself is unit-agnostic and is
   never converted. */
function toDisplayUnits(field, rawVal){
  if(rawVal===null||rawVal===undefined||isNaN(rawVal)) return null;
  return field==='w' ? rawVal*100 : rawVal;
}
function fromDisplayUnits(field, displayVal){
  if(displayVal===null||displayVal===undefined||isNaN(displayVal)) return null;
  return field==='w' ? displayVal/100 : displayVal;
}

function getCellRaw(idx, field, sn){
  const row = ADMIN_DRAFT[idx];
  if(!row) return null;
  if(row.formulas && row.formulas[sn] && row.formulas[sn][field] !== undefined && row.formulas[sn][field] !== null && row.formulas[sn][field] !== ''){
    return row.formulas[sn][field];
  }
  const store = field==='w' ? row.weights : field==='l' ? row.levels : row.scores;
  return store ? (store[sn] ?? null) : null;
}
function setCellRaw(idx, field, sn, raw){
  const row = ADMIN_DRAFT[idx];
  if(!row) return;
  if(!row.formulas) row.formulas = {};
  if(!row.formulas[sn]) row.formulas[sn] = {};
  if(isFormula(raw)){
    row.formulas[sn][field] = raw;
  } else {
    delete row.formulas[sn][field];
    const store = field==='w' ? (row.weights||(row.weights={})) : field==='l' ? row.levels : (row.scores||(row.scores={}));
    const n = (raw===''||raw===null||raw===undefined) ? null : Number(raw);
    store[sn] = (n===null || isNaN(n)) ? null : fromDisplayUnits(field, n); // the box shows/accepts %, storage keeps a fraction
  }
}
function resolveCellValue(idx, field, sn, visiting){
  visiting = visiting || new Set();
  const key = field+'_'+idx;
  if(visiting.has(key)) return null; // circular reference guard
  visiting = new Set(visiting); visiting.add(key);
  const raw = getCellRaw(idx, field, sn);
  if(raw===null || raw===undefined || raw==='') return null;
  if(isFormula(raw)) return evalFormulaExpr(raw.slice(1), sn, visiting);
  const n = Number(raw);
  return isNaN(n) ? null : n; // already a fraction for 'w' — formulas can reference it directly, no /100 needed
}
function evalFormulaExpr(expr, sn, visiting){
  let e = expr.toUpperCase();
  e = e.replace(/SUM\(([^)]+)\)/g, (m, inner)=>{
    const toks = [];
    inner.split(',').forEach(part=>{
      part = part.trim();
      const range = part.match(/^([WLS])(\d+):([WLS])(\d+)$/);
      if(range){
        const f = range[1].toLowerCase(), a = +range[2], b = +range[4];
        for(let i=Math.min(a,b); i<=Math.max(a,b); i++) toks.push(f+i);
      } else {
        const single = part.match(/^([WLS])(\d+)$/);
        if(single) toks.push(single[1].toLowerCase()+single[2]);
      }
    });
    let sum = 0;
    toks.forEach(tok=>{
      const f = tok[0], i = +tok.slice(1);
      sum += (resolveCellValue(i, f, sn, visiting) || 0);
    });
    return sum;
  });
  e = e.replace(/([WLS])(\d+)/g, (m, f, i)=>{
    const v = resolveCellValue(+i, f.toLowerCase(), sn, visiting);
    return (v===null||v===undefined) ? 0 : v;
  });
  if(!/^[0-9+\-*/(). ]*$/.test(e)) return null; // reject anything that isn't safe arithmetic
  try{ const r = Function('return (' + e + ')')(); return isFinite(r) ? r : null; }catch(err){ return null; }
}

function refreshCellDisplay(idx, field, sn){
  const el = document.getElementById(cellElId(field, idx, sn));
  if(!el || document.activeElement === el) return; // never clobber the cell the user is actively typing in
  const val = resolveCellValue(idx, field, sn);
  const dv = toDisplayUnits(field, val);
  el.value = (dv===null||dv===undefined) ? '' : Number(dv).toFixed(field==='s' ? 4 : 2);
  if(field==='l') el.style.background = levelBgColor(val);
  el.classList.toggle('is-formula', isFormula(getCellRaw(idx, field, sn)));
}
function recomputeSectionColumn(sn){
  ADMIN_DRAFT.forEach((row, idx)=>{
    ['w','l','s'].forEach(field=> refreshCellDisplay(idx, field, sn));
  });
}
function onFormulaCellFocus(idx, field, sn){
  const el = document.getElementById(cellElId(field, idx, sn));
  if(!el) return;
  const raw = getCellRaw(idx, field, sn);
  if(raw===null || raw===undefined){ el.value = ''; return; }
  if(isFormula(raw)){ el.value = raw; return; } // formula text is shown verbatim, unit-agnostic
  const dv = toDisplayUnits(field, Number(raw));
  el.value = (dv===null||dv===undefined) ? '' : String(Math.round(dv*10000)/10000);
}
function onFormulaCellBlur(idx, field, sn){
  const el = document.getElementById(cellElId(field, idx, sn));
  if(!el) return;
  setCellRaw(idx, field, sn, el.value.trim());
  recomputeSectionColumn(sn);
}

/* ---------- section-3 table: builds either the editable (formula) view
   or a clean read-only text view, based on TABLE_VIEW_MODE ---------- */
function formulaCellEditHtml(idx, field, sn, width){
  const val = resolveCellValue(idx, field, sn);
  const dv = toDisplayUnits(field, val);
  const raw = getCellRaw(idx, field, sn);
  const decimals = field==='s' ? 4 : 2;
  const shown = (dv===null||dv===undefined) ? '' : Number(dv).toFixed(decimals);
  const bg = field==='l' ? `background:${levelBgColor(val)};` : '';
  const isF = isFormula(raw);
  const jsSn = esc(sn).replace(/'/g,"\\'");
  return `<input type="text" class="formula-cell${isF?' is-formula':''}" style="width:${width}px;${bg}"
    id="${cellElId(field, idx, sn)}" value="${esc(shown)}"
    title="${isF ? 'สูตร: '+esc(raw) : ''}"
    onfocus="onFormulaCellFocus(${idx},'${field}','${jsSn}')"
    onblur="onFormulaCellBlur(${idx},'${field}','${jsSn}')">`;
}
function formulaCellTextHtml(idx, field, sn){
  const val = resolveCellValue(idx, field, sn);
  const dv = toDisplayUnits(field, val);
  const raw = getCellRaw(idx, field, sn);
  const decimals = field==='s' ? 4 : 2;
  const shown = (dv===null||dv===undefined) ? '-' : Number(dv).toFixed(decimals);
  const isF = isFormula(raw);
  const bg = field==='l' ? `background:${levelBgColor(val)};` : '';
  const cls = isF ? 'view-cell is-formula' : 'view-cell';
  const title = isF ? ` title="สูตร: ${esc(raw)}"` : '';
  return `<div class="${cls}" style="${bg}"${title}>${esc(shown)}</div>`;
}

function onTextFieldBlur(idx, field, el){
  const row = ADMIN_DRAFT[idx];
  if(!row) return;
  if(field==='name') row.name = el.value;
  else if(field==='kpi_desc') row.kpi_desc = el.value==='' ? null : el.value;
  else if(field==='unit') row.unit = el.value==='' ? null : el.value;
}
function onBandBlur(idx, bandIdx, el){
  const row = ADMIN_DRAFT[idx];
  if(!row) return;
  if(!row.bands) row.bands = [null,null,null,null,null];
  row.bands[bandIdx] = el.value==='' ? null : el.value;
}

/* =========================================================
   Admin editing for the 6 static "report card" pages
   (Q Performance, Safety-Occ Health, Security, Environmental
   x2, Legal). Reads current box content straight off the
   already-rendered deck (data-box-id put there by ragBox()),
   so there's no separate content manifest to keep in sync —
   edits are read back from the form DOM directly at save time.
   ========================================================= */
const REPORT_PAGE_NAMES = {
  qperf: 'Q Performance 2026',
  safety: 'Safety-Occupational Health Performance 2026',
  security: 'Security Performance 2026',
  env1: 'Environmental Performance 2026 (Spill + GHG)',
  env2: 'Environmental Performance 2026 (Waste to Landfill)',
  legal: 'Legal and compliance 2026',
};
function rowEditorHtml(label, value){
  return `<div class="rp-row" style="display:grid; grid-template-columns:110px 1fr auto; gap:6px; margin-bottom:4px; align-items:start;">
    <input type="text" class="rp-row-label" value="${esc(label)}" placeholder="ป้ายกำกับ" style="font-weight:600; padding:4px 6px; border:1px solid #d1d5db; border-radius:5px; font-size:11.5px;">
    <textarea rows="2" class="rp-row-value" style="font-size:11.5px; padding:4px 6px; border:1px solid #d1d5db; border-radius:5px; width:100%; box-sizing:border-box;">${esc(value)}</textarea>
    <button type="button" class="rp-del-row" title="ลบแถว" style="color:#b91c1c; background:none; border:none; cursor:pointer; font-size:14px;">✕</button>
  </div>`;
}
// Which box each predefined chart visually sits under on the live page
// (matches the exact box+chart order in buildSlides for qperf/env1) — used
// so the admin editor mirrors the real page layout instead of grouping all
// of a page's charts together at the end.
const BOX_CHART_MAP = { qperf_box0:'coreProcess', qperf_box3:'qsheTalk', qperf_box4:'fiveS', qperf_box5:'pic', env1_box3:'ghg' };
function chartPickerHtml(boxId, currentKey){
  const options = Object.keys(CHART_DEFAULTS).filter(k=>k!=='legalMonthly' && k!=='legalDept'); // legal's charts stay in the Legal section, not offered here
  return `<div class="rp-chart-picker" style="margin-top:6px;">
    <select class="rp-chart-select" style="font-size:11px; padding:4px 6px; border:1px solid #d1d5db; border-radius:5px;">
      <option value="">— เลือกกราฟที่จะแสดงตรงนี้ —</option>
      ${options.map(k=>`<option value="${k}" ${k===currentKey?'selected':''}>${esc(CHART_TITLES[k]||k)}</option>`).join('')}
    </select>
    <button type="button" class="rp-chart-add" style="font-size:11px; color:#1B2A6B; background:none; border:1px dashed #9CC9F5; border-radius:6px; padding:3px 8px; cursor:pointer; margin-left:4px;">+ กราฟ</button>
    <div class="rp-chart-slot"></div>
  </div>`;
}
function renderBoxEditorHtml(boxId, color, title, rows){
  const rowsHtml = rows.map(r=>rowEditorHtml(r.label, r.value)).join('');
  const matchedChart = boxId ? BOX_CHART_MAP[boxId] : null;
  return `<div class="rp-box" ${boxId?`data-box-id="${esc(boxId)}"`:''} style="border:1px solid #e5e7eb; border-radius:8px; padding:10px; margin-bottom:8px; background:#fafafa;">
    <div style="display:flex; gap:8px; margin-bottom:6px; align-items:center;">
      <input type="text" class="rp-title" value="${esc(title)}" placeholder="ชื่อหัวข้อกล่อง" style="flex:1; font-weight:700; padding:5px 7px; border:1px solid #d1d5db; border-radius:5px;">
      <select class="rp-color" style="padding:5px; border:1px solid #d1d5db; border-radius:5px;">
        ${['green','red','yellow','blue','gray'].map(c=>`<option value="${c}" ${c===color?'selected':''}>${c}</option>`).join('')}
      </select>
      <button type="button" class="rp-del-box" title="ลบกล่องนี้" style="color:#b91c1c; background:none; border:none; cursor:pointer; font-size:16px;">🗑</button>
    </div>
    <div class="rp-rows">${rowsHtml}</div>
    <button type="button" class="rp-add-row" style="font-size:11px; color:#1B2A6B; background:none; border:1px dashed #9CC9F5; border-radius:6px; padding:3px 8px; cursor:pointer; margin-top:4px;">+ เพิ่มแถว</button>
    ${matchedChart ? `<div style="margin-top:8px;">${chartEditorHtml(matchedChart)}</div>` : chartPickerHtml(boxId, null)}
  </div>`;
}
function wireRowButtons(rowEl){
  rowEl.querySelector('.rp-del-row').addEventListener('click', function(){ rowEl.remove(); });
}
function wireChartPicker(boxEl){
  const picker = boxEl.querySelector('.rp-chart-picker');
  if(!picker) return;
  const select = picker.querySelector('.rp-chart-select');
  const addBtn = picker.querySelector('.rp-chart-add');
  const slot = picker.querySelector('.rp-chart-slot');
  addBtn.addEventListener('click', function(){
    const key = select.value;
    if(!key){ showAdminToast('เลือกกราฟก่อนกดปุ่ม + กราฟ'); return; }
    slot.innerHTML = chartEditorHtml(key);
    addBtn.disabled = true; select.disabled = true;
  });
}
function wireBoxButtons(boxEl){
  boxEl.querySelector('.rp-del-box').addEventListener('click', function(){ boxEl.remove(); });
  boxEl.querySelector('.rp-add-row').addEventListener('click', function(){
    const rowsWrap = boxEl.querySelector('.rp-rows');
    rowsWrap.insertAdjacentHTML('beforeend', rowEditorHtml('', ''));
    wireRowButtons(rowsWrap.lastElementChild);
  });
  boxEl.querySelectorAll('.rp-row').forEach(wireRowButtons);
  wireChartPicker(boxEl);
}
function renderReportPagesSection(){
  const wrap = document.getElementById('reportPagesWrap');
  if(!wrap) return;
  const boxes = Array.from(document.querySelectorAll('#stage .rag-box[data-box-id]'));
  const byPage = {};
  boxes.forEach(el=>{
    const boxId = el.dataset.boxId;
    const pageKey = boxId.split('_box')[0];
    if(!byPage[pageKey]) byPage[pageKey] = [];
    const color = ['green','red','yellow','blue','gray'].find(c=>el.classList.contains(c)) || 'blue';
    const titleEl = el.querySelector('.rag-head');
    const title = titleEl ? titleEl.textContent.trim() : '';
    const rows = Array.from(el.querySelectorAll('.rag-row')).map(rEl=>{
      const labelEl = rEl.querySelector('.rlabel');
      const valEl = rEl.querySelector('.rval');
      const label = labelEl ? labelEl.textContent.trim() : '';
      const value = valEl ? valEl.innerHTML.replace(/<br\s*\/?>/gi,'\n') : '';
      return { label, value };
    });
    byPage[pageKey].push({ boxId, color, title, rows });
  });

  const extraData = (currentData && currentData.report_overrides && currentData.report_overrides.extra) || {};

  let html = '';
  Object.keys(REPORT_PAGE_NAMES).forEach(pageKey=>{
    const list = byPage[pageKey] || [];
    const extra = extraData[pageKey] || [];
    const extraCharts = ADMIN_EXTRA_CHARTS_DRAFT[pageKey] || [];
    html += `<div class="rp-page" data-page-key="${pageKey}">
      <h5 style="font-family:'Kanit'; font-size:13.5px; color:#1B2A6B; margin:14px 0 8px; border-bottom:1px solid #DCEEFB; padding-bottom:4px;">${esc(REPORT_PAGE_NAMES[pageKey])}</h5>
      <div class="rp-boxes">`;
    list.forEach(b => {
      html += renderBoxEditorHtml(b.boxId, b.color, b.title, b.rows);
    });
    extra.forEach(b => html += renderBoxEditorHtml(null, b.color||'blue', b.title||'', b.rows||[]));
    html += `</div><button type="button" class="ap-btn secondary rp-add-box" style="margin:0 8px 16px 0;">+ เพิ่มกล่องใหม่ในหน้านี้</button><button type="button" class="ap-btn secondary rp-add-chart" data-page-key="${pageKey}" style="margin:0 0 16px; background:#C23E8F; color:#fff;">+ กราฟ</button>`;
    if(extraCharts.length){
      html += `<div style="margin-bottom:16px;">${extraCharts.map((ch,i)=>extraChartEditorHtml(pageKey,i)).join('')}</div>`;
    }
    html += `</div>`;
  });
  if(!boxes.length){
    html += `<p class="ap-note">⚠ ไม่พบกล่องข้อมูลในสไลด์ปัจจุบัน (อาจยังโหลดสไลด์ไม่เสร็จ) ลองปิดแล้วเปิดแผงแอดมินใหม่</p>`;
  }
  wrap.innerHTML = html;

  wrap.querySelectorAll('.rp-box').forEach(wireBoxButtons);
  wrap.querySelectorAll('.rp-add-box').forEach(btn=>{
    btn.addEventListener('click', function(){
      const boxesWrap = this.closest('.rp-page').querySelector('.rp-boxes');
      boxesWrap.insertAdjacentHTML('beforeend', renderBoxEditorHtml(null, 'blue', '', [{label:'Target',value:''},{label:'Result',value:''}]));
      wireBoxButtons(boxesWrap.lastElementChild);
    });
  });
  wrap.querySelectorAll('.rp-add-chart').forEach(btn=>{
    btn.addEventListener('click', function(){ addExtraChart(this.dataset.pageKey); });
  });
}
function collectReportPagesOverrides(){
  const wrap = document.getElementById('reportPagesWrap');
  const result = { boxes: {}, extra: {} };
  if(!wrap) return result;
  wrap.querySelectorAll('.rp-page').forEach(pageEl=>{
    const pageKey = pageEl.dataset.pageKey;
    const extraList = [];
    pageEl.querySelectorAll('.rp-box').forEach(boxEl=>{
      const title = boxEl.querySelector('.rp-title').value;
      const color = boxEl.querySelector('.rp-color').value;
      const rows = Array.from(boxEl.querySelectorAll('.rp-row')).map(rowEl=>({
        label: esc(rowEl.querySelector('.rp-row-label').value),
        value: esc(rowEl.querySelector('.rp-row-value').value).replace(/\n/g, '<br>'),
      }));
      const boxId = boxEl.dataset.boxId;
      if(boxId){
        result.boxes[boxId] = { color, title: esc(title), rows };
      } else {
        extraList.push({ color, title: esc(title), rows });
      }
    });
    if(extraList.length) result.extra[pageKey] = extraList;
  });
  return result;
}

/* ---------- Section 5: editable data for the mini charts ---------- */
function chartCellId(key, kind, row, col){ return 'chd_'+key+'_'+kind+'_'+row+'_'+col; }
function onChartLabelBlur(key, i, el){ ADMIN_CHART_DRAFT[key].labels[i] = el.value; }
function onChartValueBlur(key, dsIdx, i, el){
  const v = el.value.trim();
  ADMIN_CHART_DRAFT[key].datasets[dsIdx].data[i] = v==='' ? null : Number(v);
}
// (per-box chart placement is handled by BOX_CHART_MAP + chartPickerHtml inside renderBoxEditorHtml, above)
function chartEditorHtml(key){
  const cd = ADMIN_CHART_DRAFT[key];
  const labelCells = cd.labels.map((lbl,i)=>
    `<td><input type="text" value="${esc(lbl)}" style="width:64px; padding:3px; border:1px solid #d1d5db; border-radius:4px; font-size:11px; text-align:center;" onblur="onChartLabelBlur('${key}',${i},this)"></td>`
  ).join('');
  const dsRows = cd.datasets.map((ds,dsIdx)=>{
    const cells = ds.data.map((v,i)=>
      `<td><input type="text" value="${v===null||v===undefined?'':v}" style="width:64px; padding:3px; border:1px solid #d1d5db; border-radius:4px; font-size:11px; text-align:center;" onblur="onChartValueBlur('${key}',${dsIdx},${i},this)"></td>`
    ).join('');
    return `<tr><td style="font-weight:700; font-size:11.5px; padding:4px 8px; white-space:nowrap; background:#EAF4FD;">${esc(ds.label)}</td>${cells}</tr>`;
  }).join('');
  return `<details style="margin-bottom:8px;">
    <summary style="cursor:pointer; font-weight:700; color:#1B2A6B; padding:7px 10px; background:#EAF4FD; border-radius:6px;">📊 กราฟ: ${esc(CHART_TITLES[key]||key)}</summary>
    <div class="ap-scrollx" style="margin-top:8px;"><table class="ap-table" style="font-size:11px;">
      <tr><td style="font-weight:700; font-size:11.5px; padding:4px 8px; white-space:nowrap;">หมวด</td>${labelCells}</tr>
      ${dsRows}
    </table></div>
  </details>`;
}

/* ---------- admin-added custom charts (the "+ กราฟ" feature) ----------
   These are entirely admin-defined: title, category labels, and one or
   more data series, stored per page in report_overrides.extraCharts.
   They always render via the dependency-free fallback bar renderer (same
   one used when Chart.js can't load) — simplest, and needs no Chart.js
   config of its own since the admin can add any number of categories or
   series without knowing chart-type mechanics. */
function addExtraChart(pageKey){
  ADMIN_EXTRA_CHARTS_DRAFT[pageKey].push({
    title: 'กราฟใหม่',
    labels: ['A','B','C'],
    datasets: [{ label:'ชุดข้อมูล 1', data:[0,0,0] }],
  });

}
function removeExtraChart(pageKey, idx){
  if(!confirm('ลบกราฟ "'+(ADMIN_EXTRA_CHARTS_DRAFT[pageKey][idx].title||'')+'" ใช่หรือไม่?')) return;
  ADMIN_EXTRA_CHARTS_DRAFT[pageKey].splice(idx, 1);
  renderReportPagesSection();
  showAdminToast('ลบกราฟแล้ว');
}
function onExtraChartTitleBlur(pageKey, idx, el){ ADMIN_EXTRA_CHARTS_DRAFT[pageKey][idx].title = el.value; }
function onExtraChartLabelBlur(pageKey, idx, labelIdx, el){ ADMIN_EXTRA_CHARTS_DRAFT[pageKey][idx].labels[labelIdx] = el.value; }
function onExtraChartValueBlur(pageKey, idx, dsIdx, pointIdx, el){
  const v = el.value.trim();
  ADMIN_EXTRA_CHARTS_DRAFT[pageKey][idx].datasets[dsIdx].data[pointIdx] = v === '' ? null : Number(v);
}
function onExtraChartDsLabelBlur(pageKey, idx, dsIdx, el){ ADMIN_EXTRA_CHARTS_DRAFT[pageKey][idx].datasets[dsIdx].label = el.value; }

/* ---------- Section 6: Legal and compliance page (summary numbers + monthly doc list) ---------- */

const FROZEN_COL_WIDTH = { idx: 40, actions: 64, name: 170, kpi: 220, unit: 90, band0: 120, band1: 120, band2: 120, band3: 120, band4: 120 };

/* Shift every W{n}/L{n}/S{n} formula reference in the whole table when a
   row is inserted or removed at `atIndex`, so existing formulas (both
   auto-seeded category totals and anything the admin typed by hand) keep
   pointing at the same logical rows instead of silently drifting. */
function shiftFormulaRefs(rows, atIndex, delta){
  rows.forEach(row=>{
    if(!row.formulas) return;
    Object.keys(row.formulas).forEach(sn=>{
      const f = row.formulas[sn];
      ['w','l','s'].forEach(field=>{
        const val = f[field];
        if(typeof val !== 'string' || !val.startsWith('=')) return;
        f[field] = val.replace(/([WLS])(\d+)/g, (m, letter, numStr)=>{
          let n = parseInt(numStr, 10);
          if(delta > 0){ if(n >= atIndex) n += delta; }
          else { if(n > atIndex) n += delta; } // exact refs to a just-removed row are left as-is (rare edge case) rather than guessed at
          return letter + n;
        });
      });
    });
  });
}

    kpi_desc: '', unit: '',
    bands: [null,null,null,null,null],

/* Suggest SUM formulas for the category/rollup rows so the sheet is
   "wired up" out of the box — fully editable/overwritable afterwards,
   and never overwrites a formula the admin already saved before. */
function seedDefaultCategoryFormulas(rows, force){
  const catIdxs = [];
  rows.forEach((r,i)=>{ if(r.is_category) catIdxs.push(i); });
  if(!catIdxs.length) return;
  const grandIdx = catIdxs[0];
  const subCatIdxs = catIdxs.slice(1);
  const childrenOf = {};
  subCatIdxs.forEach((ci,k)=>{
    const nextCatIdx = subCatIdxs[k+1] !== undefined ? subCatIdxs[k+1] : rows.length;
    const kids = [];
    for(let j=ci+1; j<nextCatIdx; j++){ if(!rows[j].is_category) kids.push(j); }
    childrenOf[ci] = kids;
  });
  function ensureFormula(idx, field, formula){
    const row = rows[idx];
    if(!row) return;
    ADMIN_SECTIONS.forEach(sn=>{
      if(!row.formulas) row.formulas = {};
      if(!row.formulas[sn]) row.formulas[sn] = {};
      if(force || row.formulas[sn][field] === undefined){
        row.formulas[sn][field] = formula;
      }
    });
  }
  subCatIdxs.forEach(ci=>{
    const kids = childrenOf[ci];
    if(!kids.length) return;
    ensureFormula(ci, 'w', buildSumFormula('w', kids));
    ensureFormula(ci, 's', buildSumFormula('s', kids));
    ensureFormula(ci, 'l', `=S${ci}/W${ci}`);
  });
  if(subCatIdxs.length){
    ensureFormula(grandIdx, 'w', buildSumFormula('w', subCatIdxs));
    ensureFormula(grandIdx, 's', buildSumFormula('s', subCatIdxs));
    ensureFormula(grandIdx, 'l', `=S${grandIdx}/W${grandIdx}`);
  }
}
function buildSumFormula(field, idxs){
  const F = field.toUpperCase();
  const isContig = idxs.length>1 && idxs[idxs.length-1]-idxs[0]+1===idxs.length;
  if(isContig) return `=SUM(${F}${idxs[0]}:${F}${idxs[idxs.length-1]})`;
  return `=SUM(${idxs.map(i=>F+i).join(',')})`;
}

/* ============ Helpers for report-card slides ============ */
let CURRENT_PAGE_KEY = '';
let RAGBOX_COUNTER = 0;
function ragBox(color, title, rows, chartId, chartTitle){
  const boxId = CURRENT_PAGE_KEY + '_box' + (RAGBOX_COUNTER++);
  const ov = DATA.report_overrides && DATA.report_overrides.boxes && DATA.report_overrides.boxes[boxId];
  const finalColor = (ov && ov.color) ? ov.color : color;
  const finalTitle = (ov && ov.title !== undefined) ? ov.title : title;
  const finalRows = (ov && ov.rows) ? ov.rows : rows;
  const rowsHtml = finalRows.map(r=>`<div class="rag-row"><div class="rlabel">${r.label}</div><div class="rval">${r.value}</div></div>`).join('');
  const chartHtml = chartId ? `<div class="mini-chart-card"><div class="mctitle">${chartTitle||''}</div><canvas id="${chartId}" height="90"></canvas></div>` : '';
  return `<div class="rag-box ${finalColor}" data-box-id="${boxId}"><div class="rag-head">${finalTitle}</div>${rowsHtml}</div>${chartHtml}`;
}
function renderExtraBoxes(pageKey){
  const extra = (DATA.report_overrides && DATA.report_overrides.extra && DATA.report_overrides.extra[pageKey]) || [];
  if(!extra.length) return '';
  const boxesHtml = extra.map((b,i)=>{
    const rowsHtml = (b.rows||[]).map(r=>`<div class="rag-row"><div class="rlabel">${r.label}</div><div class="rval">${r.value}</div></div>`).join('');
    return `<div class="rag-box ${b.color||'blue'}" data-extra-box="${pageKey}:${i}" style="margin-bottom:6px;"><div class="rag-head">${b.title||''}</div>${rowsHtml}</div>`;
  }).join('');
  return `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;">${boxesHtml}</div>`;
}
/* Admin-added custom charts ("+ กราฟ" in the admin panel) for a page —
   these always render via the dependency-free fallback bar renderer
   (see drawAllChartsFallback), never through Chart.js, since their shape
   isn't known ahead of time the way the 7 built-in charts are. */
function renderExtraCharts(pageKey){
  const list = (DATA.report_overrides && DATA.report_overrides.extraCharts && DATA.report_overrides.extraCharts[pageKey]) || [];
  if(!list.length) return '';
  const cardsHtml = list.map((ch,i)=>
    `<div class="mini-chart-card" data-extra-chart="${pageKey}:${i}">
      <div class="mctitle">${esc(ch.title||'')}</div>
      <canvas height="95"></canvas>
    </div>`
  ).join('');
  return `<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:10px;">${cardsHtml}</div>`;
}

/* ============ Helper: render a QSHE Index detail table for one ฝ่าย ============ */
function renderQTable(groupName, sectionNames){
  const rows = DATA.tier2_rows;
  const overallRow = rows.find(r=>r.row===3);
  const catRows = new Set([3,4,6,10,29,35]);
  let bodyHtml = '';
  rows.forEach(r=>{
    const anyVal = sectionNames.some(s => r.levels[s] !== null && r.levels[s] !== undefined);
    if(!anyVal) return;
    if(r.row===3){
      bodyHtml += `<tr class="overall-row"><td colspan="3">QSHE Index</td>${sectionNames.map(s=>`<td>${pill(r.levels[s])}</td>`).join('')}</tr>`;
      return;
    }
    if(catRows.has(r.row)){
      bodyHtml += `<tr class="cat-row"><td colspan="3">${esc(r.name)}</td>${sectionNames.map(s=>`<td>${pill(r.levels[s])}</td>`).join('')}</tr>`;
      return;
    }
    bodyHtml += `<tr>
      <td class="kpi-name">${esc(r.name)}</td>
      <td class="kpi-desc">${esc(r.kpi_desc)||''}</td>
      <td>${esc(r.unit)||''}</td>
      ${sectionNames.map(s=>`<td>${pill(r.levels[s])}</td>`).join('')}
    </tr>`;
  });

  <div class="slide content">
    <div class="brandmark">${FLAME.replace('currentColor','var(--navy)')}<span>NGV · QSHE</span></div>

        <thead>
          <tr><th rowspan="2">KPI</th><th rowspan="2">รายละเอียด</th><th rowspan="2">หน่วยวัด</th>${sectionNames.map(s=>`<th>${s}</th>`).join('')}</tr>
          <tr>${sectionNames.map(()=>`<th style="font-size:10px;">Level</th>`).join('')}</tr>
        </thead>
        <tbody>${bodyHtml}</tbody>
      </table>
    </div>
    <div class="strip"></div>
  </div>`;

const deck = document.getElementById('deck');
const stageWrap = deck; // stage lives inside #deck
let stage, slideEls, idx = 0;
let chartsDrawn = {};

function renderAll(DATA, opts){
  opts = opts || {};
  currentData = DATA;
  const prevScroll = opts.keepIndex ? window.scrollY : 0;
  const slides = buildSlides(DATA);
  deck.innerHTML = `<div id="stage">${slides.join('\\n')}</div>`;
  stage = document.getElementById('stage');
  slideEls = Array.from(document.querySelectorAll('.slide'));
  slideEls.forEach((el,i)=>{ el.id = 'section-'+i; });
  chartsDrawn = {};
  buildQuickNav();
  drawAllChartsFallback(); // show something immediately, before Chart.js has had any chance to load
  drawAllCharts();
  chartRetryCount = 0;
  retryChartsUntilReady();
  updateStatusBar(DATA);
  adjustDeckPadding();
  if(opts.keepIndex) window.scrollTo(0, prevScroll);
  updateScrollProgress();
}

function adjustDeckPadding(){
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const reminder = document.getElementById('monthReminder');
  const reminderH = reminder.style.display !== 'none' ? reminder.offsetHeight : 0;
  reminder.style.top = toolbarH+'px';
  const nav = document.getElementById('quickNav');
  nav.style.top = (toolbarH+reminderH)+'px';
  const navH = nav.offsetHeight;
  deck.style.paddingTop = (toolbarH+reminderH+navH+24)+'px';
}

function sectionLabel(el, i){
  const h = el.querySelector('h1,h2,h3');
  let txt = h ? h.textContent.trim().replace(/\s+/g,' ') : '';
  if(!txt){
    if(el.classList.contains('cover')) txt = 'หน้าปก';
    else if(el.classList.contains('thanks')) txt = 'Thank You';
    else txt = 'หัวข้อ';
  }
  return (i+1)+'. '+txt.slice(0,70);
}
function buildQuickNav(){
  const sel = document.getElementById('navSelect');
  sel.innerHTML = slideEls.map((el,i)=> `<option value="${i}">${esc(sectionLabel(el,i))}</option>`).join('');
  sel.onchange = function(){
    const el = slideEls[+this.value];
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };
}

function updateScrollProgress(){
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const docH = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docH>0 ? Math.min(100, Math.max(0,(scrollTop/docH)*100)) : 0;
  const bar = document.getElementById('progressBar');
  const pctLabel = document.getElementById('scrollPct');
  if(bar) bar.style.width = pct+'%';
  if(pctLabel) pctLabel.textContent = Math.round(pct)+'%';
}
window.addEventListener('scroll', updateScrollProgress, {passive:true});
window.addEventListener('resize', ()=>{ adjustDeckPadding(); updateScrollProgress(); });

function drawAllCharts(){
  slideEls.forEach((el,i)=>{
    if(chartsDrawn[i]) return;
    const ok = drawReportCharts(el);
    if(ok) chartsDrawn[i] = true;
  });
}
let chartRetryCount = 0;
function retryChartsUntilReady(){
  if(typeof Chart !== 'undefined'){ drawAllCharts(); return; } // upgrades any fallback bars already on screen to real Chart.js charts
  chartRetryCount++;
  if(chartRetryCount > 20) return; // ~10s of retrying in the background, then stop quietly — the fallback bars shown since render time are already a complete, working view
  setTimeout(retryChartsUntilReady, 500);
}
window.addEventListener('load', drawAllCharts); // extra safety net once every resource (incl. the Chart.js CDN script) has settled

/* =========================================================
   Dependency-free fallback: shown immediately for every chart,
   before Chart.js has had any chance to load, so nothing is ever
   left blank. If the Chart.js CDN loads successfully (checked in
   the background by retryChartsUntilReady above), drawReportCharts
   removes the matching fallback and draws the real chart in its
   place; if the CDN never loads (offline, or a firewall blocking
   cdnjs), the fallback bars simply stay as the permanent view.
   Every canvas the page knows how to draw is registered once here,
   so both the fallback and the real chart read the exact same
   numbers.
   ========================================================= */
function chartSpecs(DATA){
  const specs = {};
  const t1LevelColor = v => v===null||v===undefined ? '#D1D5DB' : (v<1.5?'#EE9C9B':v<2.5?'#F5BF87':v<3.5?'#F2E066':v<4.5?'#A6E1B7':'#65D998');
  specs.cvOverviewTier2 = { decimals:2, labels: DATA.tier2.map(t=>t.name), datasets:[{ label:'QSHE Index', data: DATA.tier2.map(t=>t.overall), colors: DATA.tier2.map(t=>t1LevelColor(t.overall)) }] };
  const barColors = ['#F5B301','#34A853','#2E9BF0','#C23E8F','#8DA6D6'];
  const lineColors = { ghg: ['#34A853','#F5892E'] };
  Object.keys(CHART_DEFAULTS).forEach(key=>{
    const cd = getChartData(DATA, key);
    const canvasId = { coreProcess:'cvCoreProcess', qsheTalk:'cvQsheTalk', fiveS:'cv5s', pic:'cvPic', ghg:'cvGhg', legalMonthly:'cvLegalMonthly', legalDept:'cvLegalDept' }[key];
    if(!canvasId) return;
    if(key === 'ghg'){
      specs[canvasId] = { decimals:0, type:'line', labels: cd.labels,
        datasets: cd.datasets.map((ds,i)=>({ label:ds.label, data:ds.data, color: lineColors.ghg[i%lineColors.ghg.length], dashed: i===1 })) };
    } else {
      specs[canvasId] = { decimals:0, labels: cd.labels, datasets: cd.datasets.map((ds,i)=>({ label:ds.label, data:ds.data, color: barColors[i%barColors.length] })) };
    }
  });
  return specs;
}
function cleanupFallback(canvas){
  if(!canvas) return;
  const next = canvas.nextElementSibling;
  if(next && next.classList && next.classList.contains('fallback-chart')) next.remove();
  canvas.style.display = '';
  canvas.dataset.fallbackDrawn = '';
}
function renderFallbackBars(canvas, spec){
  const h = canvas.height || canvas.getAttribute('height') || 90;
  const wrap = document.createElement('div');
  wrap.className = 'fallback-chart';
  wrap.style.cssText = `display:flex; align-items:flex-end; gap:4px; height:${h}px; padding:2px 2px 2px; font-family:'IBM Plex Sans Thai',sans-serif; overflow:hidden; box-sizing:border-box;`;
  const allVals = spec.datasets.flatMap(ds=>ds.data).filter(v=>v!==null && v!==undefined);
  const maxV = Math.max(1, ...allVals);
  const decimals = spec.decimals !== undefined ? spec.decimals : 0;
  spec.labels.forEach((label, i)=>{
    const col = document.createElement('div');
    col.style.cssText = 'flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;';
    const barsRow = document.createElement('div');
    barsRow.style.cssText = 'display:flex; align-items:flex-end; gap:1px; width:100%; flex:1; min-height:0; justify-content:center;';
    spec.datasets.forEach((ds,dsi)=>{
      const v = ds.data[i];
      const pct = (v===null||v===undefined) ? 0 : Math.max(v===0?0:2, (v/maxV)*100);
      const barCol = document.createElement('div');
      barCol.style.cssText = 'display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; flex:1; max-width:20px;';
      const barColor = (ds.colors && ds.colors[i]) || ds.color || '#2E9BF0';
      if(v!==null && v!==undefined){
        const valLbl = document.createElement('div');
        valLbl.textContent = Number(v).toFixed(decimals);
        valLbl.style.cssText = 'font-size:7px; color:#51607A; line-height:1.3;';
        barCol.appendChild(valLbl);
      }
      const bar = document.createElement('div');
      bar.style.cssText = `width:100%; height:${pct}%; background:${barColor}; border-radius:2px 2px 0 0; min-height:${v?'2px':'0'};`;
      barCol.appendChild(bar);
      barsRow.appendChild(barCol);
    });
    col.appendChild(barsRow);
    const lbl = document.createElement('div');
    lbl.textContent = label;
    lbl.title = label;
    lbl.style.cssText = 'font-size:6.5px; color:#51607A; text-align:center; width:100%; max-height:16px; line-height:1.3; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:none; margin-top:1px;';
    col.appendChild(lbl);
    wrap.appendChild(col);
  });
  canvas.style.display = 'none';
  canvas.insertAdjacentElement('afterend', wrap);
}
function renderFallbackLine(canvas, spec){
  const h = Math.max(canvas.height || canvas.getAttribute('height') || 130, 130); // logical drawing height used for the math below — the SVG itself stretches to fill whatever space the box actually gives it
  const w = canvas.clientWidth || canvas.parentElement.clientWidth || 400;
  const padL = 34, padR = 8, padT = 14, padB = 16;
  const plotW = Math.max(10, w - padL - padR);
  const plotH = Math.max(10, h - padT - padB);
  const allVals = spec.datasets.flatMap(ds=>ds.data).filter(v=>v!==null && v!==undefined);
  const maxV = Math.max(1, ...allVals);
  const decimals = spec.decimals !== undefined ? spec.decimals : 0;
  const n = spec.labels.length;
  const xAt = i => padL + (n<=1 ? plotW/2 : (i/(n-1))*plotW);
  const yAt = v => padT + plotH - (v/maxV)*plotH;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none'); // stretch to fill the box fully rather than letterboxing to a fixed aspect ratio
  svg.style.cssText = 'display:block; width:100%; height:100%; font-family:\'IBM Plex Sans Thai\',sans-serif;';

  // gridline + x labels
  const axis = document.createElementNS(svgNS,'line');
  axis.setAttribute('x1', padL); axis.setAttribute('y1', padT+plotH); axis.setAttribute('x2', padL+plotW); axis.setAttribute('y2', padT+plotH);
  axis.setAttribute('stroke', '#E1E8F0'); axis.setAttribute('stroke-width', '1');
  svg.appendChild(axis);
  spec.labels.forEach((label,i)=>{
    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x', xAt(i)); t.setAttribute('y', h-3); t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','7'); t.setAttribute('fill','#51607A');
    t.textContent = label;
    svg.appendChild(t);
  });

  spec.datasets.forEach(ds=>{
    const pts = ds.data.map((v,i)=> v===null||v===undefined ? null : [xAt(i), yAt(v)]);
    const validPts = pts.filter(p=>p);
    if(validPts.length){
      const path = document.createElementNS(svgNS,'path');
      const d = validPts.map((p,idx)=> (idx===0?'M':'L')+p[0]+','+p[1]).join(' ');
      path.setAttribute('d', d);
      path.setAttribute('fill','none');
      path.setAttribute('stroke', ds.color || '#2E9BF0');
      path.setAttribute('stroke-width', '2');
      if(ds.dashed) path.setAttribute('stroke-dasharray','5,4');
      svg.appendChild(path);
    }
    pts.forEach((p,i)=>{
      if(!p) return;
      if(!ds.dashed){
        const c = document.createElementNS(svgNS,'circle');
        c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r','2.5');
        c.setAttribute('fill', ds.color || '#2E9BF0');
        svg.appendChild(c);
        const t = document.createElementNS(svgNS,'text');
        t.setAttribute('x', p[0]); t.setAttribute('y', p[1]-6); t.setAttribute('text-anchor','middle');
        t.setAttribute('font-size','7'); t.setAttribute('fill', ds.color || '#2E9BF0'); t.setAttribute('font-weight','700');
        t.textContent = Number(ds.data[i]).toFixed(decimals);
        svg.appendChild(t);
      }
    });
  });

  const wrap = document.createElement('div');
  wrap.className = 'fallback-chart';
  wrap.style.cssText = `flex:1 1 auto; min-height:${h}px; display:flex; flex-direction:column;`;
  svg.style.flex = '1 1 auto';
  svg.style.minHeight = '0';
  wrap.appendChild(svg);

  // small legend under the chart
  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex; gap:10px; justify-content:center; font-size:7px; color:#51607A; margin-top:2px; flex:none;';
  spec.datasets.forEach(ds=>{
    const item = document.createElement('span');
    item.style.cssText = 'display:flex; align-items:center; gap:3px;';
    const swatch = document.createElement('span');
    swatch.style.cssText = `width:9px; height:2px; background:${ds.color||'#2E9BF0'}; display:inline-block;`;
    item.appendChild(swatch);
    const lbl = document.createElement('span');
    lbl.textContent = ds.label;
    item.appendChild(lbl);
    legend.appendChild(item);
  });
  wrap.appendChild(legend);

  canvas.style.display = 'none';
  canvas.insertAdjacentElement('afterend', wrap);
}
function drawAllChartsFallback(){
  const DATA = currentData || DEMO_DATA;
  const specs = chartSpecs(DATA);
  Object.keys(specs).forEach(id=>{
    document.querySelectorAll('#'+id).forEach(canvas=>{
      if(canvas.dataset.fallbackDrawn) return;
      canvas.dataset.fallbackDrawn = '1';
      if(specs[id].type === 'line') renderFallbackLine(canvas, specs[id]);
      else renderFallbackBars(canvas, specs[id]);
    });
  });
  drawExtraChartsFallback(DATA);
}
// Admin-added custom charts ("+ กราฟ") always render this way (never through
// Chart.js) since, unlike the 7 built-in charts, they have no fixed shape
// known ahead of time to write a Chart.js config for.
function drawExtraChartsFallback(DATA){
  document.querySelectorAll('[data-extra-chart]').forEach(el=>{

  });
}

/* =========================================================
   Manual backup / restore via a downloaded .json file.
   Unlike localStorage (tied to one browser), this file is a real,
   portable copy of the data — it can be saved outside the browser,
   emailed, put in shared storage, or loaded back on any device to
   restore the exact same QSHE Index state. This is the main way
   this static (no-server) page gets a "real" backup rather than
   only the in-browser save.
   ========================================================= */
function downloadBackupJson(){
  const DATA = currentData || DEMO_DATA;
  const period = (DATA.meta && DATA.meta.period_label) || 'data';
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const filename = `QSHE_Index_backup_${period.replace(/[^\w\-]+/g,'_')}_${stamp}.json`;
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showAdminToast('ดาวน์โหลดไฟล์สำรอง "' + filename + '" แล้ว');
}
function isValidQsheData(obj){
  return !!(obj && typeof obj === 'object'
    && obj.meta && typeof obj.meta === 'object'
    && Array.isArray(obj.tier1) && Array.isArray(obj.tier2) && Array.isArray(obj.tier2_rows)
    && obj.safety_lta && obj.safety_pse && obj.groups);
}
function handleRestoreJsonFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ alert('ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง อ่านไม่สำเร็จ: ' + err.message); return; }
    if(!isValidQsheData(parsed)){
      alert('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูล QSHE Index ที่ถูกต้อง (โครงสร้างข้อมูลไม่ตรง) — กรุณาเลือกไฟล์ .json ที่ดาวน์โหลดจากปุ่ม "💾 สำรองข้อมูล" เท่านั้น');
      return;
    }
    if(!confirm('นำเข้าข้อมูลจากไฟล์นี้จะแทนที่ข้อมูลปัจจุบันทั้งหมด (รวมถึงที่บันทึกไว้ในเบราว์เซอร์นี้) ยืนยันหรือไม่?')) return;
    saveToLocalStorage(parsed);
    renderAll(parsed);
    showAdminToast('นำเข้าข้อมูลจากไฟล์สำเร็จแล้ว');
  };

}

   IMPORTANT LIMITATION: this file has no server, so neither of
   these is a true background/push system — both only run while
   someone has this page open in a browser:

     (or after Save), comparing today's month against the month
     the data was last marked "updated". It cannot notify anyone
     while the file is closed.
   - "Send email" builds a mailto: link (opens the person's own
     email app with the message pre-filled) since a static HTML
     file cannot send email on its own — the person still has to
     hit Send themselves.

const THAI_MONTH_NAMES = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function currentYearMonth(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function checkMonthReminder(DATA){
  const banner = document.getElementById('monthReminder');
  const nowYm = currentYearMonth();

  if(nowYm === lastYm){ banner.style.display = 'none'; adjustDeckPadding(); return; }
  const monthName = THAI_MONTH_NAMES[new Date().getMonth()];
  document.getElementById('reminderMonthName').textContent = ' ' + monthName;
  banner.style.display = 'flex';
  adjustDeckPadding();
}

      alert('ยังไม่ได้ตั้งอีเมลผู้รับ — เข้าโหมดแอดมินแล้วกรอกอีเมลผู้รับไว้ที่หัวข้อ "0) ช่วงเวลาของข้อมูล" ก่อนครับ');

      `ข้อมูล QSHE Index Dashboard ประจำงวด ${period} อัปเดตเสร็จสิ้นแล้ว`,
      '',
      `ค่าเฉลี่ย QSHE Index ระดับฝ่าย: ${DATA.meta.avg_tier1 ?? '-'}`,
      `ค่าเฉลี่ย QSHE Index ระดับส่วน: ${DATA.meta.avg_tier2 ?? '-'}`,
      '',
      `เอกสารกฎหมาย — Total: ${fmtInt(ls.total)}, Complete: ${fmtInt(ls.complete)}, On process: ${fmtInt(ls.on_process)}, Delay: ${fmtInt(ls.delay)}`,

/* =========================================================
   Export to PowerPoint (.pptx), built live from currentData —
   so it always reflects whatever the admin has edited/saved,
   using the same colors/levels as the on-screen tables. Uses
   PptxGenJS (loaded via CDN in <head>); if that CDN didn't load,
   this tells the person plainly rather than failing silently.
   Scope: cover, QSHE Index overview (with a native chart), one
   table slide per group, the Safety table, and a closing slide —
   the report-card pages (RAG boxes, icons, mini-charts) are not
   recreated here since PowerPoint's native shapes can't reproduce
   that layout faithfully; those stay as reference in the web page.
   ========================================================= */
async function exportToPptx(){
  if(typeof PptxGenJS === 'undefined'){
    alert('โหลดไลบรารีสำหรับสร้าง PowerPoint ไม่สำเร็จ (อินเทอร์เน็ตอาจไม่เชื่อมต่อ หรือถูกบล็อกโดยไฟร์วอลล์) — ลองเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้านี้อีกครั้ง');
    return;
  }
  const btn = document.getElementById('btnExportPptx');
  const originalLabel = btn.textContent;
  btn.textContent = '⏳ กำลังสร้างไฟล์...';
  btn.disabled = true;
  try{
    const DATA = currentData || DEMO_DATA;
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name:'WIDE', width:13.333, height:7.5 });
    pptx.layout = 'WIDE';
    const NAVY = '1B2A6B', BLUE = '2E9BF0', WHITE = 'FFFFFF';
    const period = DATA.meta.period_label || 'M7-2569';

    // ---- Cover slide ----
    let s = pptx.addSlide();
    s.background = { color: NAVY };
    s.addText('NGV QSHE Performance', { x:0.6, y:2.6, w:12, h:1, fontSize:40, bold:true, color:WHITE, fontFace:'Calibri' });
    s.addText(period, { x:0.6, y:3.6, w:12, h:0.6, fontSize:20, color:'BFD8FB' });

    // ---- QSHE Index overview slide ----
    s = pptx.addSlide();
    s.addText('QSHE Index — ภาพรวม ' + period, { x:0.4, y:0.25, w:12.5, h:0.6, fontSize:24, bold:true, color:NAVY });
    const avg2 = DATA.meta.avg_tier2 !== null && DATA.meta.avg_tier2 !== undefined ? DATA.meta.avg_tier2
      : (DATA.tier2.filter(t=>t.overall!=null).reduce((a,b,_,arr)=>a+b.overall/arr.length,0));
    s.addText([
      { text: 'ค่าเฉลี่ย QSHE Index ระดับส่วน: ', options:{ bold:true } },
      { text: Number(avg2).toFixed(2) + ' / 5.00', options:{ bold:true, color:BLUE } },
    ], { x:0.4, y:0.95, w:8, h:0.4, fontSize:14 });
    s.addText('จำนวนหน่วยงานระดับส่วนทั้งหมด: ' + DATA.tier2.length + ' ส่วน', { x:0.4, y:1.35, w:8, h:0.35, fontSize:12, color:'51607A' });
    const chartData = [{
      name: 'QSHE Index',
      labels: DATA.tier2.map(t=>t.name),
      values: DATA.tier2.map(t=> t.overall===null||t.overall===undefined ? 0 : Number(t.overall.toFixed(2))),
    }];
    s.addChart('bar', chartData, {
      x:0.4, y:1.9, w:12.5, h:5.1,
      barColor: BLUE, showValue:true, dataLabelPosition:'outEnd', dataLabelFontSize:9,
      catAxisLabelFontSize:9, valAxisMinVal:0, valAxisMaxVal:5, showLegend:false,
      chartColors: DATA.tier2.map(t=> t.overall!=null ? SOLID[levelBand(t.overall)].replace('#','') : 'D1D5DB'),
    });

    // ---- One table slide per group (พกก./บกก./ปกก./ตกก.) ----
    const groupNames = Object.keys(DATA.groups || {});
    groupNames.forEach(gName=>{
      addGroupTableSlide(pptx, DATA, gName, DATA.groups[gName], NAVY, BLUE, WHITE);
    });
    // standalone ผจ.คก. (present in tier2 but not part of any group)
    const groupedSections = new Set(groupNames.flatMap(g=>DATA.groups[g]));
    const standalone = DATA.tier2.map(t=>t.name).filter(n=>!groupedSections.has(n));
    if(standalone.length) addGroupTableSlide(pptx, DATA, 'ผจ.คก.', standalone, NAVY, BLUE, WHITE);

    // ---- Safety Management Effectiveness ----
    s = pptx.addSlide();
    s.addText('1. Safety Management Effectiveness — LTA / PSE', { x:0.4, y:0.25, w:12.5, h:0.5, fontSize:22, bold:true, color:NAVY });
    const safetyNames = Object.keys(DATA.safety_lta || {});
    const safetyRows = [
      [{ text:'', options:{ fill:{color:NAVY} } }, ...safetyNames.map(n=>({ text:n, options:{ bold:true, color:WHITE, fill:{color:NAVY}, align:'center' } }))],
      [{ text:'LTA', options:{ bold:true, align:'center' } }, ...safetyNames.map(n=>({ text: fmtCellNum(DATA.safety_lta[n]), options:{ align:'center' } }))],
      [{ text:'PSE', options:{ bold:true, align:'center' } }, ...safetyNames.map(n=>({ text: fmtCellNum(DATA.safety_pse[n]), options:{ align:'center' } }))],
    ];
    s.addTable(safetyRows, { x:0.4, y:1.0, w:12.5, colW:[1.6, ...safetyNames.map(()=>(12.5-1.6)/safetyNames.length)], fontSize:12, border:{type:'solid', color:'E1E8F0', pt:1}, autoPage:false });

    // ---- Thank you slide ----
    s = pptx.addSlide();
    s.background = { color: BLUE };
    s.addText('Thank You', { x:0.6, y:3.2, w:12, h:1, fontSize:44, bold:true, color:WHITE, align:'center' });

    await pptx.writeFile({ fileName: 'QSHE_Index_' + period.replace(/[^\w\-]+/g,'_') + '.pptx' });
  } catch(err){
    console.error(err);
    alert('สร้างไฟล์ PowerPoint ไม่สำเร็จ: ' + err.message);
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}
function fmtCellNum(v){ return (v===null||v===undefined) ? '-' : String(v); }
function addGroupTableSlide(pptx, DATA, groupTitle, sectionNames, NAVY, BLUE, WHITE){
  const s = pptx.addSlide();
  s.addText('QSHE Index ' + groupTitle + ' ' + (DATA.meta.period_label||''), { x:0.3, y:0.2, w:12.7, h:0.45, fontSize:18, bold:true, color:NAVY });
  const rows = DATA.tier2_rows.map((r, idx)=>{
    const nameCell = { text: r.name, options:{ bold: r.is_category, align:'left', fontSize:9,
      color: r.is_category ? WHITE : '16213A', fill: r.is_category ? {color: NAVY} : undefined } };
    const cells = sectionNames.map(sn=>{
      const v = r.levels ? r.levels[sn] : null;
      const band = (v!==null && v!==undefined && typeof v === 'number') ? levelBand(v) : null;
      const text = (v===null||v===undefined) ? '-' : (typeof v === 'number' ? v.toFixed(2) : String(v));
      return { text, options:{ align:'center', fontSize:9, bold: r.is_category,
        color: r.is_category ? WHITE : '16213A',
        fill: r.is_category ? {color:NAVY} : (band ? {color:SOLID[band].replace('#','')} : {color:'F4F8FC'}) } };
    });
    return [nameCell, ...cells];
  });
  const header = [
    { text:'KPI', options:{ bold:true, fill:{color:'DCEBF7'}, color:NAVY, fontSize:9, align:'left' } },
    ...sectionNames.map(sn=>({ text:sn, options:{ bold:true, fill:{color:'DCEBF7'}, color:NAVY, fontSize:9, align:'center' } })),
  ];
  const nameColW = 3.6;
  const otherColW = (12.7 - nameColW) / sectionNames.length;
  s.addTable([header, ...rows], {
    x:0.3, y:0.75, w:12.7, colW:[nameColW, ...sectionNames.map(()=>otherColW)],
    fontSize:9, border:{type:'solid', color:'FFFFFF', pt:1}, autoPage:true, autoPageLineWeight:-1,
    rowH:0.26,
  });
}
