            <code>=W4*L4</code>, <code>=S4+S5+S6</code>, <code>=SUM(S4:S6)</code>, <code>=S3/W3</code>
            (W=ช่อง %, L=ช่อง Level, S=ช่อง score ของแถวลำดับที่นั้นๆ — <b>ช่อง % จะถูกนับเป็นเศษส่วนในสูตรเสมอ</b> เช่น 5% จะกลายเป็น 0.05 ให้อัตโนมัติ จึงไม่ต้องหาร 100 เองในสูตร — ดูเลขลำดับแถวได้จากคอลัมน์ <b>"แถวที่"</b> ริมซ้ายสุดของตาราง ซึ่งจะติดตรึงไว้ให้เห็นเสมอแม้เลื่อนตารางไปทางขวา)
            เมื่ออยู่ในโหมดแก้ไข คลิกเข้าไปในช่องจะเห็นสูตรจริงให้แก้ คลิกออกจะเห็นค่าที่คำนวณได้ — กด "✅ เสร็จสิ้น" เมื่อแก้ไขเสร็จ ตารางจะกลับมาแสดงเป็นข้อความล้วน อ่านง่าย ไม่มีกรอบช่องกรอกรกตา<br>
            แถบสีน้ำเงินเข้มคือแถวหมวดหมู่รวม (QSHE Index / 1. Role Model / 2. Quality / 3. SSHE / 4. KM-Academy / 5. ปิด Gap) — ผมใส่สูตร SUM ให้อัตโนมัติเป็นค่าเริ่มต้นแล้ว แต่แก้เป็นสูตรอื่น หรือพิมพ์ตัวเลขทับเองก็ได้ทุกช่อง<br>
            <span class="flag-note" style="display:inline-block; margin-top:6px; padding:8px 12px;">💡 <b>ข้อใหม่ vs ข้อย่อย:</b> ระบบแยกจาก "ชื่อ" ในช่อง KPI Name เท่านั้น ไม่มีสถานะพิเศษในระบบ — ถ้าตั้งชื่อพร้อมเลขข้อ (เช่น "3.11 หัวข้อใหม่") จะเข้าใจว่าเป็น<b>ข้อใหม่แยกต่างหาก</b> ถ้า<b>ปล่อยชื่อว่างไว้</b> (แบบที่กด ＋ เพิ่มแถวจะปล่อยว่างให้อัตโนมัติ) จะถือว่าเป็น<b>ข้อย่อยต่อเนื่อง</b>จากแถวด้านบน ตามรูปแบบเดียวกับที่มีอยู่แล้วในตาราง (เช่น "3.1 LTA" ตามด้วยแถวว่างชื่อที่มีแต่คำอธิบาย "Loss Time Accident (ผู้รับเหมา)")</span>
          </p>
          <div class="ap-scrollx" style="max-height:460px; overflow-y:auto;" id="tier2TableWrap"></div>
        </div>
        <div class="ap-section">
          <h4>4) หน้ารายงาน (Q Performance / Safety / Security / Environment / Legal)</h4>
          <p class="ap-note">
            แก้ไข <b>ชื่อหัวข้อ สี และข้อความ Target/Result</b> ของแต่ละกล่องในหน้ารายงานทั้ง 6 หน้าได้โดยตรงที่นี่ — ลบแถวหรือกล่องที่ไม่ต้องการได้ (✕ / 🗑) และเพิ่มแถวหรือกล่องใหม่ได้ด้วยปุ่ม "+"<br>
            <span class="flag-note" style="display:inline-block; margin-top:6px; padding:8px 12px;">💡 กราฟของแต่ละกล่องอยู่ต่อท้ายกล่องนั้นเลย ตรงกับตำแหน่งจริงบนหน้าเว็บ (กด "📊 กราฟ: ..." เพื่อขยายดู) — กล่องไหนยังไม่มีกราฟ จะมีตัวเลือก "+ กราฟ" ให้เลือกแนบกราฟที่มีอยู่มาแสดงตรงนี้ได้ — ส่วนตัวเลขสรุปและตารางเอกสารกฎหมายของหน้า Legal ย้ายไปแก้ในหัวข้อ "5) หน้า Legal and compliance" ด้านล่าง ซึ่งรวมกราฟของหน้านั้นไว้ด้วยกันแล้วเช่นกัน</span>
          </p>
          <div id="reportPagesWrap"></div>
        </div>
        <div class="ap-section">
          <h4>5) หน้า Legal and compliance (รวมกราฟของหน้านี้ไว้ด้วยกัน)</h4>
          <p class="ap-note">แก้ไขได้ทั้งหมด เนื่องจากรายการเอกสารต้องอัปเดตทุกเดือน — ตัวเลขสรุป 4 ช่อง, ชื่อเดือนที่แสดงในหัวข้อ, ตารางรายการเอกสาร (เพิ่ม/ลบ/แก้ไขแถวได้), และกราฟทั้ง 2 อันของหน้านี้</p>
          <div id="legalStatsWrap"></div>
          <div id="legalChartsWrap" style="margin-top:14px;"></div>
        </div>
      </div>
      <div class="ap-foot">
        <button class="ap-btn reset" id="apReset">🗑️ ล้างและใช้ข้อมูลตัวอย่าง</button>
        <button class="ap-btn cancel" id="apCancel">ยกเลิก</button>
        <button class="ap-btn save" id="apSave">💾 บันทึกการเปลี่ยนแปลง</button>
      </div>
    </div>`;
  overlay.classList.add('open');

  renderTier2Table();
  renderReportPagesSection();
  renderLegalChartsSection();
  renderLegalStatsSection();
  document.getElementById('apTableModeToggle').addEventListener('click', function(){
    TABLE_VIEW_MODE = !TABLE_VIEW_MODE;
    renderTier2Table();
  });

  document.getElementById('apClose').addEventListener('click', closeAdminPanel);
  document.getElementById('apCancel').addEventListener('click', closeAdminPanel);
  document.getElementById('apReset').addEventListener('click', function(){
    if(!confirm('ล้างข้อมูลที่บันทึกไว้ทั้งหมดและกลับไปใช้ข้อมูลตัวอย่าง ยืนยันหรือไม่?')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    renderAll(DEMO_DATA);
    closeAdminPanel();
  });
  document.getElementById('apSave').addEventListener('click', function(){ saveAdminPanel(DATA); });
}

function closeAdminPanel(){
  document.getElementById('adminOverlay').classList.remove('open');
  document.getElementById('adminOverlay').innerHTML = '';
  ADMIN_DRAFT = null; // discard any in-progress edits if this was a Cancel
  ADMIN_CHART_DRAFT = null;
  ADMIN_LEGAL_DRAFT = null;
  ADMIN_EXTRA_CHARTS_DRAFT = null;
}

function saveAdminPanel(baseData){
  // deep clone so we don't mutate the data currently on screen until save is confirmed
  const newData = JSON.parse(JSON.stringify(baseData));

  const periodInput = document.getElementById('apPeriodLabel');
  if(periodInput) newData.meta.period_label = periodInput.value.trim();
  const notifyEmailInput = document.getElementById('apNotifyEmail');
  if(notifyEmailInput) newData.meta.notify_email = notifyEmailInput.value.trim();

  document.querySelectorAll('[data-t1-idx]').forEach(inp => {
    const i = +inp.dataset.t1Idx, field = inp.dataset.field;
    const v = inp.value === '' ? null : Number(inp.value);
    newData.tier1[i][field] = v;
  });
  document.querySelectorAll('[data-safety]').forEach(inp => {
    const kind = inp.dataset.safety, name = inp.dataset.name;
    const v = inp.value === '' ? null : Number(inp.value);
    (kind === 'lta' ? newData.safety_lta : newData.safety_pse)[name] = v;
  });
  // ADMIN_DRAFT already holds every edit the admin made (name, description,
  // unit, target bands, and every %/Level/score value or formula), kept
  // live-updated as each field is blurred, and is also the source of truth
  // for row order/count now that rows can be added or removed — so rebuild
  // tier2_rows FROM ADMIN_DRAFT entirely rather than trying to zip it
  // against the old array (which may now be a different length).
  if(ADMIN_DRAFT){
    newData.tier2_rows = ADMIN_DRAFT.map((draftRow, idx) => {
      const row = {
        row: draftRow.row !== undefined ? draftRow.row : null, // original Excel row number, if any — rows added here in the admin panel don't have one
        is_category: !!draftRow.is_category,
        name: draftRow.name,
        kpi_desc: draftRow.kpi_desc ?? null,
        unit: draftRow.unit ?? null,
        bands: draftRow.bands ? draftRow.bands.slice() : [null,null,null,null,null],
        formulas: draftRow.formulas ? JSON.parse(JSON.stringify(draftRow.formulas)) : undefined,
        levels: {}, weights: {}, scores: {},
      };
      ADMIN_SECTIONS.forEach(sn=>{
        const w = resolveCellValue(idx, 'w', sn);
        const l = resolveCellValue(idx, 'l', sn);
        const s = resolveCellValue(idx, 's', sn);
        row.weights[sn] = (w===null||w===undefined) ? null : w; // resolveCellValue already returns a fraction for 'w'
        row.levels[sn] = (l===null||l===undefined) ? null : l;
        row.scores[sn] = (s===null||s===undefined) ? null : Math.round(s*10000)/10000;
      });
      row.has_level = Object.values(row.levels).some(x => x !== null && x !== undefined);
      return row;
    });
  }

  // keep the tier2 rollup (used by the overview chart/heatmap) in sync with tier2_rows,
  // since both should reflect the same category rows (3=overall,4=role_model,6=quality,10=sshe,29=km_academy,35=asset_gap)
  const catRowMap = { 3: 'overall', 4: 'role_model', 6: 'quality', 10: 'sshe', 29: 'km_academy', 35: 'asset_gap' };
  const bySection = {};
  newData.tier2.forEach(t => { bySection[t.name] = t; });
  newData.tier2_rows.forEach(r => {
    if(catRowMap[r.row]){
      const field = catRowMap[r.row];
      Object.keys(r.levels).forEach(sn => {
        if(bySection[sn]) bySection[sn][field] = r.levels[sn];
      });
    }
  });

  const t1v = newData.tier1.map(t=>t.qshe_index).filter(v=>v!==null && v!==undefined);
  const t2v = newData.tier2.map(t=>t.overall).filter(v=>v!==null && v!==undefined);
  newData.meta.avg_tier1 = t1v.length ? round2(t1v.reduce((a,b)=>a+b,0)/t1v.length) : null;
  newData.meta.avg_tier2 = t2v.length ? round2(t2v.reduce((a,b)=>a+b,0)/t2v.length) : null;
  newData.meta.generated_note = 'แก้ไขด้วยตนเองโดยแอดมิน — ' + new Date().toLocaleString('th-TH');

  // Section 4: title/color/row edits (and any added/removed boxes) for the
  // Q Performance / Safety / Security / Environment report slides, read
  // straight from the editor form built by renderReportPagesSection().
  newData.report_overrides = collectReportPagesOverrides();
  if(ADMIN_EXTRA_CHARTS_DRAFT) newData.report_overrides.extraCharts = JSON.parse(JSON.stringify(ADMIN_EXTRA_CHARTS_DRAFT));

  // Section 5: chart data edits, already kept live in ADMIN_CHART_DRAFT as
  // each cell is blurred — save as-is (only real edits differ from CHART_DEFAULTS,
  // but storing the full set is simplest and keeps chart rendering in sync).
  if(ADMIN_CHART_DRAFT) newData.chart_overrides = JSON.parse(JSON.stringify(ADMIN_CHART_DRAFT));

  if(ADMIN_LEGAL_DRAFT){
    newData.legal_stats = JSON.parse(JSON.stringify(ADMIN_LEGAL_DRAFT.stats));
    newData.legal_month_docs = JSON.parse(JSON.stringify(ADMIN_LEGAL_DRAFT.docs));
  }

  saveToLocalStorage(newData);
  renderAll(newData, { keepIndex: true });
  closeAdminPanel();
}
</script>
